<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Abstract Glow & Geometry -->
  <circle cx="600" cy="400" r="280" fill="url(#glowGrad)" filter="blur(60px)"/>
  
  <!-- Outer Wireframe Ring -->
  <circle cx="600" cy="400" r="240" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="4 6"/>
  <circle cx="600" cy="400" r="180" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-opacity="0.2"/>
  <circle cx="600" cy="400" r="120" fill="none" stroke="#e2e8f0" stroke-width="0.75" stroke-opacity="0.3"/>
  
  <!-- Workspace Mockup Card -->
  <g transform="translate(250, 180)">
    <!-- Browser window chrome -->
    <rect width="700" height="440" rx="12" fill="#0c0d12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
    <!-- Top Bar -->
    <rect width="700" height="42" rx="12" fill="#141620"/>
    <rect y="30" width="700" height="12" fill="#141620"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.6"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b" opacity="0.6"/>
    <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.6"/>
    
    <text x="350" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="1">zenith.community/workspace</text>
    
    <!-- Sidebar -->
    <rect x="0" y="42" width="160" height="398" fill="#090a0f" fill-opacity="0.8"/>
    <text x="24" y="80" font-family="'Syne', sans-serif" font-weight="700" font-size="14" fill="#ffffff" letter-spacing="2">ZENITH</text>
    <text x="24" y="120" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" letter-spacing="1">ROOMS</text>
    <rect x="20" y="132" width="120" height="28" rx="6" fill="#1e2230"/>
    <text x="32" y="150" font-family="'Inter', sans-serif" font-size="11" fill="#f8fafc">◈ Study Hall</text>
    <text x="32" y="186" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">◈ Focus Sprint</text>
    <text x="32" y="218" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">◈ Meditation</text>
    <text x="32" y="250" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">◈ Workout Club</text>

    <!-- Main Workspace Stage -->
    <rect x="180" y="62" width="500" height="200" rx="8" fill="#11131c" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06"/>
    <text x="204" y="96" font-family="'Syne', sans-serif" font-size="18" font-weight="600" fill="#ffffff">Deep Work Session #042</text>
    <text x="204" y="118" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Sync collaborative goals, pomodoro intervals, and focus room audio.</text>
    
    <!-- Active Participants -->
    <g transform="translate(204, 140)">
      <circle cx="16" cy="16" r="16" fill="#3b82f6" opacity="0.8"/>
      <circle cx="44" cy="16" r="16" fill="#10b981" opacity="0.8"/>
      <circle cx="72" cy="16" r="16" fill="#8b5cf6" opacity="0.8"/>
      <circle cx="100" cy="16" r="16" fill="#f59e0b" opacity="0.8"/>
      <text x="130" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">+14 synchronized</text>
    </g>

    <g transform="translate(204, 185)">
      <rect width="110" height="32" rx="6" fill="#ffffff" fill-opacity="0.1"/>
      <text x="22" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8fafc">ENTER ROOM ↗</text>
    </g>

    <!-- Lower Panels -->
    <rect x="180" y="280" width="235" height="140" rx="8" fill="#11131c" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06"/>
    <text x="200" y="310" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" letter-spacing="1">INTERVAL TIMER</text>
    <text x="200" y="352" font-family="'Syne', sans-serif" font-size="34" font-weight="700" fill="#ffffff">25:00</text>
    <text x="200" y="380" font-family="'Inter', sans-serif" font-size="11" fill="#10b981">● High Focus State</text>

    <rect x="445" y="280" width="235" height="140" rx="8" fill="#11131c" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06"/>
    <text x="465" y="310" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" letter-spacing="1">COMMUNITY GOALS</text>
    <text x="465" y="340" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">✓ DSA Algorithm Sprint</text>
    <text x="465" y="365" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">✓ System Architecture Review</text>
    <text x="465" y="390" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">○ Evening Athletic Conditioning</text>
  </g>

  <!-- Editorial Metadata Floating Accents -->
  <text x="80" y="100" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" letter-spacing="3">01 / ARCHITECTURE</text>
  <text x="80" y="125" font-family="'Syne', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1">ZENITH DIGITAL WORKSPACE</text>
  <text x="1120" y="740" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569" text-anchor="end" letter-spacing="2">REACT • JAVASCRIPT • HTML • CSS</text>
</svg>

