<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="engGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080c"/>
      <stop offset="50%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <pattern id="engGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#38bdf8" stroke-width="0.35" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#engGrad)"/>
  <rect width="100%" height="100%" fill="url(#engGrid)"/>

  <!-- Blueprint Lines & Elevation Geometry -->
  <g stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2" fill="none">
    <line x1="100" y1="580" x2="1100" y2="580" stroke-dasharray="6 4"/>
    <line x1="100" y1="460" x2="1100" y2="460" stroke-dasharray="2 4"/>
    <line x1="200" y1="100" x2="200" y2="700" stroke-opacity="0.1"/>
    <line x1="1000" y1="100" x2="1000" y2="700" stroke-opacity="0.1"/>
  </g>

  <!-- Technical Structure Representation -->
  <g transform="translate(300, 200)">
    <!-- Building outline -->
    <rect x="100" y="40" width="400" height="280" fill="#0d141f" stroke="#e2e8f0" stroke-width="1.5" stroke-opacity="0.3"/>
    
    <!-- Foundation Elevation Level -->
    <rect x="60" y="320" width="480" height="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    
    <!-- Hydraulic Jacks -->
    <g fill="#94a3b8">
      <rect x="120" y="340" width="24" height="60" rx="3" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="220" y="340" width="24" height="60" rx="3" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="350" y="340" width="24" height="60" rx="3" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="450" y="340" width="24" height="60" rx="3" stroke="#e2e8f0" stroke-width="1"/>
    </g>

    <!-- Ground Level -->
    <line x1="20" y1="400" x2="580" y2="400" stroke="#64748b" stroke-width="2"/>
    <line x1="20" y1="406" x2="580" y2="406" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Elevation Indicators -->
    <path d="M 540 320 L 540 400" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="555" y="365" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">+1.85m ELEVATION</text>
    
    <!-- Live telemetry overlay -->
    <g transform="translate(130, 80)">
      <rect width="340" height="180" rx="6" fill="#060a10" fill-opacity="0.85" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">SYSTEM: TDBD FULL-STACK TELEMETRY</text>
      <text x="20" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">Dynamic Hydraulic Pressure: NOMINAL</text>
      <text x="20" y="85" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">PostgreSQL Cloud Sync: CONNECTED</text>
      <text x="20" y="110" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">Prisma ORM Models: 12 Active Tables</text>
      <text x="20" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22c55e">● PRODUCTION BACKEND ONLINE</text>
    </g>
  </g>

  <!-- Editorial typography labels -->
  <text x="80" y="100" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" letter-spacing="3">02 / CIVIL TECH &amp; BACKEND</text>
  <text x="80" y="125" font-family="'Syne', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1">TDBD ENGINEERING PLATFORM</text>
  <text x="1120" y="740" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569" text-anchor="end" letter-spacing="2">REACT • NODE.JS • EXPRESS • POSTGRESQL • PRISMA</text>
</svg>

